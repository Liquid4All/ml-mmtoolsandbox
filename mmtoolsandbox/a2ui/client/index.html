<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A2UI Client</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #f5f5f5;
        }
        #status {
            padding: 8px 16px;
            font-size: 12px;
            background: #333;
            color: white;
            text-align: center;
            display: none; /* Hidden by default, shown on error/connecting */
        }
        #app {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        a2ui-surface {
            display: block;
            width: 100%;
        }
    </style>
    <!-- ES Module Shims for Import Map support -->
    <script async src="https://ga.jspm.io/npm:es-module-shims@1.10.0/dist/es-module-shims.js"></script>
    <script type="importmap">
    {
        "imports": {
            "lit": "https://esm.sh/lit@3.1.2",
            "lit/": "https://esm.sh/lit@3.1.2/",
            "@lit/context": "https://esm.sh/@lit/context@1.1.0",
            "@lit/decorators.js": "https://esm.sh/lit@3.1.2/decorators.js",
            "lit/decorators.js": "https://esm.sh/lit@3.1.2/decorators.js",
            "lit/directives/style-map.js": "https://esm.sh/lit@3.1.2/directives/style-map.js",
            "lit/directives/class-map.js": "https://esm.sh/lit@3.1.2/directives/class-map.js",
            "@lit/directives/style-map.js": "https://esm.sh/lit@3.1.2/directives/style-map.js",
            "@lit-labs/signals": "https://esm.sh/@lit-labs/signals@0.1.3",
            "signal-utils/": "https://esm.sh/signal-utils@0.21.1/",
            "markdown-it": "https://esm.sh/markdown-it@14.1.0",
            "@a2ui/lit": "/lib/renderers/lit/dist/src/index.js",
            "@a2ui/lit/": "/lib/renderers/lit/dist/src/",
            "@a2ui/web_core": "/lib/renderers/web_core/dist/src/v0_8/index.js",
            "@a2ui/web_core/": "/lib/renderers/web_core/dist/src/v0_8/"
        }
    }
    </script>
</head>
<body>
    <div id="status">Connecting...</div>
    <div id="app"></div>

    <script type="module">
        import { html, render } from 'lit';
        import * as A2UI from '@a2ui/lit';

        // --- Theme Configuration ---
        const defaultTheme = {
            components: {
                Text: {
                    all: { color: '#333' },
                    h1: { fontSize: '2em', fontWeight: 'bold', margin: '0.67em 0' },
                    h2: { fontSize: '1.5em', fontWeight: 'bold', margin: '0.83em 0' },
                    body: { fontSize: '1em', lineHeight: '1.5' },
                    caption: { fontSize: '0.8em', color: '#666' }
                },
                Column: { all: { display: 'flex', flexDirection: 'column', gap: '10px' } },
                Row: { all: { display: 'flex', flexDirection: 'row', gap: '10px' } },
                Image: { all: { maxWidth: '100%', height: 'auto', borderRadius: '8px' } }
            },
            additionalStyles: {
                Column: { height: 'auto', minHeight: 'auto' },
                TextField: {
                    width: '100%', padding: '10px', border: '1px solid #ddd', borderRadius: '6px',
                    fontSize: '16px', display: 'block', boxSizing: 'border-box', marginBottom: '10px'
                },
                DateTimeInput: {
                    width: '100%', padding: '10px', border: '1px solid #ddd', borderRadius: '6px',
                    fontSize: '16px', display: 'block', boxSizing: 'border-box', marginBottom: '10px'
                },
                Button: {
                    padding: '12px 20px', cursor: 'pointer', backgroundColor: '#007bff', color: 'white',
                    border: 'none', borderRadius: '6px', fontSize: '16px', fontWeight: '600',
                    display: 'block', width: '100%', transition: 'background-color 0.2s'
                }
            }
        };

        // --- Theme Injection (Helper to ensure styles apply to Shadow DOM) ---
        function injectTheme(node) {
            if (node.nodeType === 1 && node.tagName.toLowerCase().startsWith('a2ui-')) {
                node.theme = defaultTheme;
                // Recursively check shadow root
                if (node.shadowRoot) {
                    observeRoot(node.shadowRoot);
                    node.shadowRoot.querySelectorAll('*').forEach(injectTheme);
                }
            }
        }

        const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                mutation.addedNodes.forEach(injectTheme);
            });
        });

        function observeRoot(rootNode) {
            observer.observe(rootNode, { childList: true, subtree: true });
        }
        observeRoot(document.body);

        // --- Application Logic ---
        const statusEl = document.getElementById('status');
        const appEl = document.getElementById('app');
        const processor = A2UI.v0_8.Data.createSignalA2uiMessageProcessor();
        let currentSurfaceId = null;
        let ws;

        function connect() {
            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${wsProtocol}//${window.location.hostname}:8001`;

            statusEl.style.display = 'block';
            statusEl.textContent = 'Connecting...';
            statusEl.style.background = '#333';

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                statusEl.style.display = 'none';
                console.log('Connected to A2UI Bridge');
            };

            ws.onclose = () => {
                statusEl.style.display = 'block';
                statusEl.textContent = 'Disconnected. Retrying...';
                statusEl.style.background = '#dc3545';
                setTimeout(connect, 3000);
            };

            ws.onmessage = (event) => {
                try {
                    const message = JSON.parse(event.data);
                    handleMessage(message);
                } catch (e) {
                    console.error('Error parsing message:', e);
                }
            };
        }

        function handleMessage(message) {
            processor.processMessages([message]);

            if (message.beginRendering) {
                currentSurfaceId = message.beginRendering.surfaceId;
            } else if (message.deleteSurface && currentSurfaceId === message.deleteSurface.surfaceId) {
                currentSurfaceId = null;
            }
            renderApp();
        }

        function renderApp() {
            if (!currentSurfaceId) {
                render(html`<div style="text-align: center; color: #666; margin-top: 50px;">Waiting for content...</div>`, appEl);
                return;
            }

            const surface = processor.getSurfaces().get(currentSurfaceId);

            render(html`
                <a2ui-surface
                    .surfaceId=${currentSurfaceId}
                    .surface=${surface ? { ...surface } : undefined}
                    .processor=${processor}
                    .enableCustomElements=${true}
                    .theme=${defaultTheme}
                    @a2ui-action=${handleAction}
                ></a2ui-surface>
            `, appEl);

            // Ensure theme is applied after render
            setTimeout(() => {
                const surfaceEl = appEl.querySelector('a2ui-surface');
                if (surfaceEl) injectTheme(surfaceEl);
            }, 50);
        }

        function handleAction(event) {
            console.log('User Action:', event.detail);
            ws.send(JSON.stringify({
                userAction: {
                    name: event.detail.name,
                    surfaceId: currentSurfaceId,
                    sourceComponentId: event.detail.sourceComponentId || "unknown",
                    timestamp: new Date().toISOString(),
                    context: event.detail.context || {}
                }
            }));
        }

        // Start
        connect();
    </script>
</body>
</html>
